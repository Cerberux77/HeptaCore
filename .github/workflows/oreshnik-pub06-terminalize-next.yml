name: Oreshnik PUB-06 Terminalize and Next

on:
  push:
    branches: [master]
    paths:
      - ".github/oreshnik-pub06-terminalize-next-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: heptacore-oreshnik-pub06-terminalize-next
  cancel-in-progress: false

env:
  TASK_ID: S-HC-PUB-06-REELS-STORIES-PUBLISHERS
  RUN_ID: run-manuel-S-HC-PUB-06-REELS-STORIES-PUBLISHERS-20260906155441-d36bde04
  ASSIGNMENT_ID: asg-c810d3df-2238-40ee-80ec-0a26622deb28
  OPERATOR: manuel
  MERGE_COMMIT: f6cb367b6ff8bd889609eeb0d038981bb2ea5422
  PULL_REQUEST: "27"
  ORESHNIK_VERSION: 0.3.0-alpha.6
  ORESHNIK_COMMIT: 3e4345b76238e18da8e4d259f537f0e9c64ce099
  ORESHNIK_SHA256: 66e0e6683cdf9587a873b27f20dd8c8538199eb511068e9c40b682ceadb176e8

jobs:
  terminalize-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup controller
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact Oreshnik consumer
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          npm ci --ignore-scripts
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "$ORESHNIK_VERSION"
          grep -F "oreshnik-cli-$ORESHNIK_VERSION-$ORESHNIK_COMMIT.tgz" package.json
          npm run oreshnik:ready

      - name: Freeze CAS and validate PUB-06 lifecycle
        id: cas
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          HEAD_SHA="$(git rev-parse origin/master)"
          CONTROL_SHA="$(git rev-parse origin/oreshnik/control)"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$MERGE_COMMIT" "$HEAD_SHA"
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const read=(ref,p)=>JSON.parse(execFileSync('git',['show',`${ref}:${p}`],{encoding:'utf8'}));
          const task=read('origin/master',`var/oreshnik/tasks/${process.env.TASK_ID}.json`);
          const control=read('origin/oreshnik/control','control-plane.json');
          const a=(control.assignments||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const r=(control.runs||[]).find(x=>x.runId===process.env.RUN_ID);
          const c=(control.claims||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          if(task.status!=='ready_for_integration' && task.status!=='integrated') throw new Error(`unexpected task status ${task.status}`);
          if(!a||a.taskId!==process.env.TASK_ID||a.runId!==process.env.RUN_ID||a.operator!==process.env.OPERATOR) throw new Error('assignment participant drift');
          if(!r||r.taskId!==process.env.TASK_ID||r.assignmentId!==process.env.ASSIGNMENT_ID||r.operator!==process.env.OPERATOR) throw new Error('run participant drift');
          if(!c||c.taskId!==process.env.TASK_ID||c.assignmentId!==process.env.ASSIGNMENT_ID||c.operator!==process.env.OPERATOR) throw new Error('claim participant drift');
          if(a.status==='superseded'||r.status==='superseded') throw new Error('PUB-06 lifecycle superseded unexpectedly');
          console.log(JSON.stringify({task:task.status,assignment:a.status,run:r.status,claim:c.status,master:process.env.GITHUB_SHA},null,2));
          NODE
          echo "master=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "control=$CONTROL_SHA" >> "$GITHUB_OUTPUT"

      - name: Prepare terminal handoff
        run: |
          cat > "$RUNNER_TEMP/PUB06-HANDOFF.md" <<'EOF'
          # S-HC-PUB-06-REELS-STORIES-PUBLISHERS — terminal handoff

          PUB-06 is integrated through PR #27. Instagram Reels, Instagram Stories image/video, Facebook Reels and Facebook Stories image/video real immediate publishing are implemented with fail-closed format validation and durable publishing finalization. Scheduled parity remains outside PUB-06.

          Validation evidence before integration: provider-specific suite 8/8 PASS; typecheck PASS; build PASS; worker PASS; full tests PASS; reconcile/diff PASS; Oreshnik Digital Twin CI PASS; Vercel deployment status PASS.

          Governed Run: run-manuel-S-HC-PUB-06-REELS-STORIES-PUBLISHERS-20260906155441-d36bde04. Assignment: asg-c810d3df-2238-40ee-80ec-0a26622deb28. Merge: f6cb367b6ff8bd889609eeb0d038981bb2ea5422.
          EOF

      - name: Terminalize PUB-06 natively
        id: term
        env:
          EXPECTED_HEAD: ${{ steps.cas.outputs.master }}
          EXPECTED_CONTROL: ${{ steps.cas.outputs.control }}
        run: |
          set -euo pipefail
          AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          node node_modules/oreshnik-cli/dist/cli.js task terminalize \
            --task "$TASK_ID" \
            --run "$RUN_ID" \
            --assignment "$ASSIGNMENT_ID" \
            --operator "$OPERATOR" \
            --expected-head "$EXPECTED_HEAD" \
            --expected-control-head "$EXPECTED_CONTROL" \
            --merge-commit "$MERGE_COMMIT" \
            --pull-request "$PULL_REQUEST" \
            --at "$AT" \
            --handoff "$RUNNER_TEMP/PUB06-HANDOFF.md" \
            --evidence "merge:$MERGE_COMMIT" "pr:$PULL_REQUEST" "digital-twin:34093168186" "provider-tests:8/8" "oreshnik:$ORESHNIK_VERSION@$ORESHNIK_COMMIT" "oreshnik-sha256:$ORESHNIK_SHA256" \
            --mother master \
            --repo . \
            --json | tee "$RUNNER_TEMP/terminalization.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/terminalization.json','utf8'));
          const phases=['terminalization_prepared','canonical_projection_persisted','integration_confirmed','control_projection_confirmed','resources_released','terminalization_verified'];
          if(r.status!=='terminalization_verified') throw new Error(`terminalization=${r.status}: ${(r.contradictions||[]).join('; ')}`);
          for(const p of phases) if(!(r.completedPhases||[]).includes(p)) throw new Error(`missing phase ${p}`);
          console.log(JSON.stringify(r,null,2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`master=${r.masterHead}\ncontrol=${r.controlHead}\n`);
          NODE

      - name: Verify durable terminal projection
        env:
          TERMINAL_MASTER: ${{ steps.term.outputs.master }}
          TERMINAL_CONTROL: ${{ steps.term.outputs.control }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          test "$(git rev-parse origin/master)" = "$TERMINAL_MASTER"
          test "$(git rev-parse origin/oreshnik/control)" = "$TERMINAL_CONTROL"
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const read=(ref,p)=>JSON.parse(execFileSync('git',['show',`${ref}:${p}`],{encoding:'utf8'}));
          const task=read('origin/master',`var/oreshnik/tasks/${process.env.TASK_ID}.json`);
          const run=read('origin/master',`var/oreshnik/runs/${process.env.TASK_ID}/${process.env.RUN_ID}.json`);
          const claim=read('origin/master',`var/oreshnik/claims/${process.env.TASK_ID}.json`);
          const control=read('origin/oreshnik/control','control-plane.json');
          const a=(control.assignments||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const r=(control.runs||[]).find(x=>x.runId===process.env.RUN_ID);
          const c=(control.claims||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const reserved=(control.zones||[]).filter(x=>x.assignmentId===process.env.ASSIGNMENT_ID&&x.status==='reserved');
          if(task.status!=='integrated'||run.taskStatus!=='integrated'||run.claimStatus!=='released'||claim.status!=='released') throw new Error('canonical terminal projection incomplete');
          if(a?.status!=='released'||r?.status!=='integrated'||c?.status!=='released'||reserved.length) throw new Error(`control terminal projection incomplete ${a?.status}/${r?.status}/${c?.status}/zones=${reserved.length}`);
          console.log(JSON.stringify({task:task.status,run:run.taskStatus,claim:claim.status,assignment:a.status,controlRun:r.status,controlClaim:c.status,reservedZones:reserved.length},null,2));
          NODE
          git cat-file -e "origin/master:docs/07_handoffs/$TASK_ID-HANDOFF.md"

      - name: Remove transient bootstrap from canonical master
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master'
          git reset --hard origin/master
          git rm .github/workflows/oreshnik-pub06-terminalize-next.yml .github/oreshnik-pub06-terminalize-next-trigger
          git commit -m "chore(oreshnik): remove transient PUB-06 terminalizer"
          git push origin HEAD:master

      - name: Reconcile clean terminal master
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          git reset --hard origin/master
          npm run oreshnik:ready
          ROOT="$RUNNER_TEMP/oreshnik-wt-next"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$ROOT" --repo . --json | tee "$RUNNER_TEMP/dispatch-init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo . --json | tee "$RUNNER_TEMP/reconcile.json"

      - name: Dispatch next native Goal
        id: goal
        run: |
          set -euo pipefail
          node node_modules/oreshnik-cli/dist/cli.js goal --harness chatgpt --auto-align --repo . --max-retries 3 --json | tee "$RUNNER_TEMP/goal.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const g=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/goal.json','utf8'));
          console.log('NEXT_GOAL_SUMMARY '+JSON.stringify({result:g.result,taskId:g.taskId??null,runId:g.runId??null,assignmentId:g.assignmentId??null,functionalBranch:g.functionalBranch??null,worktreePath:g.worktreePath??null,alignmentIssues:g.alignmentIssues??null}));
          if(!['assigned','resumed','no_task'].includes(g.result)) throw new Error(`next goal requires recovery: ${g.result}`);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshnik-pub06-terminalize-next
          path: |
            ${{ runner.temp }}/terminalization.json
            ${{ runner.temp }}/dispatch-init.json
            ${{ runner.temp }}/reconcile.json
            ${{ runner.temp }}/goal.json
          if-no-files-found: ignore

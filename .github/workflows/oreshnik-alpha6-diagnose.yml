name: Oreshnik Alpha6 Candidate Diagnostics

on:
  push:
    branches: [master]
    paths:
      - ".github/oreshnik-alpha6-diagnose-trigger"

permissions:
  contents: read

env:
  FUNCTIONAL_BRANCH: dispatch/manuel/manuel-chatgpt1/recovery/HC-ORESHNIK-RECOVERY-ALPHA6/2954c98970

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FUNCTIONAL_BRANCH }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Show candidate identity
        run: |
          git rev-parse HEAD
          node node_modules/oreshnik-cli/dist/cli.js --version
      - name: Typecheck candidate
        run: npm run typecheck

name: Oreshnik Alpha6 Tests Diagnostics

on:
  push:
    branches: [master]
    paths:
      - ".github/oreshnik-alpha6-tests-diagnose-trigger"

permissions:
  contents: read

env:
  FUNCTIONAL_BRANCH: dispatch/manuel/manuel-chatgpt1/recovery/HC-ORESHNIK-RECOVERY-ALPHA6/2954c98970

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout governed candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FUNCTIONAL_BRANCH }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and generate Prisma
        run: |
          npm ci --ignore-scripts
          npm run db:generate
      - name: Candidate identity
        run: |
          git rev-parse HEAD
          node node_modules/oreshnik-cli/dist/cli.js --version
      - name: Run full tests
        run: npm run test

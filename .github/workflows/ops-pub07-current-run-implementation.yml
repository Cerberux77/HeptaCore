            ${{ runner.temp }}/pub07-full-tests.txt
            ${{ runner.temp }}/pub07-files.txt
            ${{ runner.temp }}/pub07-head.txt
            ${{ runner.temp }}/pub07-local-reconcile.json
          if-no-files-found: ignore

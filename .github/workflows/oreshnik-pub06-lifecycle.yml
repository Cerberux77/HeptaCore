name: Oreshnik PUB-06 Governed Lifecycle
on:
  push:
    branches:
      - dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
permissions:
  contents: write
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    env:
      TASK: S-HC-PUB-06-REELS-STORIES-PUBLISHERS
      RUN_ID: run-manuel-S-HC-PUB-06-REELS-STORIES-PUBLISHERS-20260906155441-d36bde04
      INSTANCE: manuel-chatgpt2
      SESSION: session_93473a46b2904930916a9715222bf6d5
      BRANCH: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove ephemeral workflow
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          git rm .github/workflows/oreshnik-pub06-lifecycle.yml
          git commit -m "chore(ci): remove PUB-06 lifecycle bootstrap"
          git push origin "HEAD:$BRANCH"
      - name: Bootstrap Oreshnik CLI on controller checkout
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run db:generate
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "0.3.0-alpha.6"
      - name: Register ephemeral runner and takeover same governed Run
        id: takeover
        run: |
          set -euo pipefail
          WTROOT="$RUNNER_TEMP/oreshnik-wt-pub06-lifecycle"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$WTROOT" --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch takeover \
            --run "$RUN_ID" \
            --reason "Resume governed PUB-06 lifecycle after complete green validation in Actions run 34062221297" \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" --takeover \
            --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/takeover.json"
          WT="$(node -e 'const x=require(process.argv[1]); process.stdout.write(x.worktreePath)' "$RUNNER_TEMP/takeover.json")"
          test -n "$WT" && test -d "$WT"
          echo "worktree=$WT" >> "$GITHUB_OUTPUT"
          git -C "$WT" status --short
          test "$(git -C "$WT" branch --show-current)" = "$BRANCH"
      - name: Prepare managed Run worktree
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          npm ci --ignore-scripts
          TMP="$(mktemp -d)"
          cd "$TMP"
          TGZ="$(npm pack @esbuild/linux-x64@0.28.0 --silent)"
          tar -xzf "$TGZ"
          mkdir -p "$WT/node_modules/@esbuild/linux-x64"
          cp -R package/. "$WT/node_modules/@esbuild/linux-x64/"
          cd "$WT"
          npm run db:generate
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
      - name: Start governed validation
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js evidence \
            --task "$TASK" --run "$RUN_ID" --operator manuel \
            --details "PUB-06 implementation complete; provider-specific 8/8 tests and full typecheck/build/tests/worker/reconcile/diff gates passed in GitHub Actions run 34062221297." \
            --start-validation
          git add var/oreshnik docs/07_handoffs docs/obsidian-vault 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(oreshnik): start PUB-06 validation"; fi
          git push origin "HEAD:$BRANCH"
      - name: Advance governed delivery to ready_for_integration
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js evidence \
            --task "$TASK" --run "$RUN_ID" --operator manuel \
            --details "PUB-06 accepted technically: Instagram Reel/Story image+video and Facebook Reel/Story image+video provider flows validated; global typecheck, build, tests, worker validation and reconcile all green. Actions run 34062221297." \
            --ready-for-integration
          git add var/oreshnik docs/07_handoffs docs/obsidian-vault 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(oreshnik): mark PUB-06 ready for integration"; fi
          git push origin "HEAD:$BRANCH"
          node - <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('var/oreshnik/task-board.json','utf8'));
          const t=b.tasks.find(x=>x.id===process.env.TASK);
          if (!t || t.status!=='ready_for_integration') throw new Error(`unexpected local task status ${t?.status}`);
          console.log(`Local governed status: ${t.status}`);
          NODE
      - name: Release resources while preserving pending delivery
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          node "$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js" dispatch release \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" \
            --run "$RUN_ID" --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/release.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/release.json','utf8'));
          if (!['ready_for_integration','integrated'].includes(r.integrationState) && !String(r.requiredAction||'').includes('integrat')) {
            console.log(r);
          }
          console.log(`release integrationState=${r.integrationState} taskStatus=${r.taskStatus} runStatus=${r.runStatus} requiredAction=${r.requiredAction}`);
          NODE
      - name: Reconcile dispatcher and report next eligible task
        run: |
          set -euo pipefail
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/reconcile.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch peek \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" \
            --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/peek.json"

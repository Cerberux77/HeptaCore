name: Ops PUB07 Replan v1

on:
  push:
    branches:
      - ops/pub07-current-run-implementation-20260910
    paths:
      - .github/pub07-replan-v1-trigger

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pub07-current-run-implementation-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Recover structured evidence and validate PUB-07B
        run: bash .github/ops/pub07b-evidence-recover-v2.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub07b-evidence-recovery
          path: |
            ${{ runner.temp }}/pub07b-recover-init.json
            ${{ runner.temp }}/pub07b-recover-takeover.json
            ${{ runner.temp }}/pub07b-dry-run.stdout
            ${{ runner.temp }}/pub07b-dry-run.stderr
            ${{ runner.temp }}/pub07b-structured-evidence.json
            ${{ runner.temp }}/pub07b-recover-handoff.json
            ${{ runner.temp }}/pub07b-recover-handoff-validation.json
            ${{ runner.temp }}/pub07b-recover-validation-start.txt
            ${{ runner.temp }}/pub07b-recover-ready.txt
            ${{ runner.temp }}/pub07b-recover-reconcile.json
            ${{ runner.temp }}/pub07b-recover-final-head.txt
          if-no-files-found: ignore

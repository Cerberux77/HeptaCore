name: Ops PUB07 Replan v1

on:
  push:
    branches:
      - ops/pub07-current-run-implementation-20260910
    paths:
      - .github/pub07-replan-v1-trigger

permissions:
  contents: write
  actions: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pub07-current-run-implementation-20260910
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Replan and validate PUB-07
        run: bash .github/ops/pub07-replan-run.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub07-replan-v1
          path: |
            ${{ runner.temp }}/dispatch-init.json
            ${{ runner.temp }}/old-takeover.json
            ${{ runner.temp }}/old-release.json
            ${{ runner.temp }}/amendment.json
            ${{ runner.temp }}/post-amend-reconcile.json
            ${{ runner.temp }}/new-dispatch.json
            ${{ runner.temp }}/new-run-id.txt
            ${{ runner.temp }}/new-branch.txt
            ${{ runner.temp }}/pub07-replan-status.txt
            ${{ runner.temp }}/pub07-replan-focused.txt
            ${{ runner.temp }}/pub07-replan-typecheck.txt
            ${{ runner.temp }}/pub07-replan-build.txt
            ${{ runner.temp }}/pub07-replan-worker.txt
            ${{ runner.temp }}/pub07-replan-full-tests.txt
            ${{ runner.temp }}/pub07-replan-files.txt
            ${{ runner.temp }}/pub07-replan-product-head.txt
            ${{ runner.temp }}/pub07-replan-local-reconcile.json
            ${{ runner.temp }}/pub07-replan-final-head.txt
          if-no-files-found: ignore

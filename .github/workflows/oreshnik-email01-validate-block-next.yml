name: Oreshnik EMAIL-01 Block Retry and Next

on:
  push:
    branches: [master]
    paths:
      - ".github/oreshnik-email01-validate-block-next-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: heptacore-oreshnik-email01-block-retry
  cancel-in-progress: false

env:
  TASK_ID: S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION
  RUN_ID: run-manuel-S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION-20260910144612-ccbed006
  ASSIGNMENT_ID: asg-913a8dde-5aef-4f8b-8731-1af33f2228d9
  OPERATOR: manuel
  HARNESS: chatgpt
  INSTANCE: manuel-chatgpt1
  SESSION: session_5bb21c8aa01e49bcb03886ae23d26864
  FUNCTIONAL_BRANCH: dispatch/manuel/manuel-chatgpt1/email-infra/S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION/ceaa8b659d
  VALIDATED_HEAD: 18aec87
  EXPECTED_AGENT_UID: agent_e8dd52d1d5de4f40a9a4d9923ffda155
  ORESHNIK_VERSION: 0.3.0-alpha.6
  ORESHNIK_LOCAL_STATE_DIR: ${{ runner.temp }}/oreshnik-local-state

jobs:
  block-and-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup exact Oreshnik controller
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install and preflight
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          npm ci --ignore-scripts
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "$ORESHNIK_VERSION"
          npm run oreshnik:ready
          mkdir -p "$ORESHNIK_LOCAL_STATE_DIR"

      - name: Rehydrate the exact preserved Run on this runner
        id: takeover
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/oreshnik-wt-email01-retry"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$ROOT" --repo . --json > "$RUNNER_TEMP/init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch takeover \
            --run "$RUN_ID" \
            --reason "Retry EMAIL-01 external block with shared execution identity after all software gates passed" \
            --operator "$OPERATOR" --harness "$HARNESS" --instance "$INSTANCE" --session "$SESSION" \
            --takeover --repo . --json | tee "$RUNNER_TEMP/takeover.json"
          WT="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/takeover.json");process.stdout.write(x.worktreePath||"")')"
          MACHINE="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/takeover.json");process.stdout.write(x.machineId||"")')"
          AGENT="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/takeover.json");process.stdout.write(x.agentInstanceUid||"")')"
          test -n "$WT" && test -d "$WT"
          test -n "$MACHINE"
          test "$AGENT" = "$EXPECTED_AGENT_UID"
          test "$(git -C "$WT" branch --show-current)" = "$FUNCTIONAL_BRANCH"
          git -C "$WT" fetch origin "+refs/heads/$FUNCTIONAL_BRANCH:refs/remotes/origin/$FUNCTIONAL_BRANCH"
          git -C "$WT" merge --ff-only "origin/$FUNCTIONAL_BRANCH"
          git -C "$WT" merge-base --is-ancestor "$VALIDATED_HEAD" HEAD
          echo "WT=$WT" >> "$GITHUB_ENV"
          echo "ORESHNIK_MACHINE_ID_OVERRIDE=$MACHINE" >> "$GITHUB_ENV"
          echo "worktree=$WT" >> "$GITHUB_OUTPUT"

      - name: Verify preserved green evidence and execution identity
        run: |
          set -euo pipefail
          test -f "$ORESHNIK_LOCAL_STATE_DIR/agent-instances.json"
          test -f "$ORESHNIK_LOCAL_STATE_DIR/execution-sessions.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const instances=JSON.parse(fs.readFileSync(process.env.ORESHNIK_LOCAL_STATE_DIR+'/agent-instances.json','utf8'));
          const sessions=JSON.parse(fs.readFileSync(process.env.ORESHNIK_LOCAL_STATE_DIR+'/execution-sessions.json','utf8'));
          const i=instances.find(x=>x.agentInstanceUid===process.env.EXPECTED_AGENT_UID);
          const s=sessions.find(x=>x.sessionId===process.env.SESSION);
          if(!i||i.machineId!==process.env.ORESHNIK_MACHINE_ID_OVERRIDE||i.operatorId!==process.env.OPERATOR||i.harnessId!==process.env.HARNESS) throw new Error('hydrated instance identity mismatch');
          if(!s||s.agentInstanceUid!==i.agentInstanceUid||s.status!=='active') throw new Error('hydrated session identity mismatch');
          console.log('EMAIL01_EXECUTION_IDENTITY_PASS');
          NODE
          cd "$WT"
          HJSON="$(find var/oreshnik/handoffs/$TASK_ID -type f -name '*.json' | sort | tail -1)"
          test -n "$HJSON" && test -f "$HJSON"
          node "$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js" handoff validate --path "$HJSON" --json | tee "$RUNNER_TEMP/handoff-revalidate.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const p=process.env.WT+'/var/oreshnik/handoffs/'+process.env.TASK_ID;
          const f=fs.readdirSync(p).filter(x=>x.endsWith('.json')).sort().at(-1);
          const h=JSON.parse(fs.readFileSync(p+'/'+f,'utf8'));
          if(h.stability?.classification!=='BLOCKED_EXTERNAL') throw new Error('expected BLOCKED_EXTERNAL handoff');
          if(!h.functional?.testsRun?.includes('full tests PASS')) throw new Error('full green gate evidence missing');
          console.log('EMAIL01_GREEN_EVIDENCE_PASS');
          NODE

      - name: Apply native external block from governed worktree
        run: |
          set -euo pipefail
          cd "$WT"
          node "$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js" task block \
            --task "$TASK_ID" --run "$RUN_ID" --operator "$OPERATOR" \
            --harness "$HARNESS" --instance "$INSTANCE" --session "$SESSION" \
            --kind awaiting_external_validation \
            --reason "Final owned HeptaCore sender domain remains intentionally deferred; software foundation is complete and validated while Vercel remains the temporary web origin." \
            --external-action "Select the final owned HeptaCore domain, configure it in Resend, and verify SPF, DKIM and DMARC before production email activation." \
            --resume-policy explicit_authorization_required \
            --repo "$WT"

      - name: Persist blocked runtime projection
        run: |
          set -euo pipefail
          cd "$WT"
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          mapfile -t dirty < <(git status --porcelain=v1 | sed 's/^...//')
          printf 'post-block dirty: %s\n' "${dirty[@]:-}"
          for p in "${dirty[@]}"; do
            case "$p" in
              var/oreshnik/*|docs/oreshnik/*|docs/obsidian-vault/*|docs/07_handoffs/*) ;;
              *) echo "Unexpected post-block path: $p" >&2; exit 42;;
            esac
          done
          git add var/oreshnik docs/oreshnik docs/obsidian-vault docs/07_handoffs 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(email): persist external production-domain block"; fi
          git push origin "HEAD:$FUNCTIONAL_BRANCH"

      - name: Verify canonical blocked and resources released
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo . --json | tee "$RUNNER_TEMP/reconcile-after.json"
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const read=(ref,p)=>JSON.parse(execFileSync('git',['show',`${ref}:${p}`],{encoding:'utf8'}));
          const task=read('origin/master',`var/oreshnik/tasks/${process.env.TASK_ID}.json`);
          const control=read('origin/oreshnik/control','control-plane.json');
          const a=(control.assignments||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const r=(control.runs||[]).find(x=>x.runId===process.env.RUN_ID);
          const c=(control.claims||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const zones=(control.zones||[]).filter(x=>x.assignmentId===process.env.ASSIGNMENT_ID&&x.status==='reserved');
          if(task.status!=='blocked'||task.blockState?.kind!=='awaiting_external_validation'||task.blockState?.preservedRunId!==process.env.RUN_ID) throw new Error('canonical block projection incomplete');
          if(a?.status!=='released'||r?.status!=='released'||c?.status!=='released'||zones.length) throw new Error(`release incomplete ${a?.status}/${r?.status}/${c?.status}/zones=${zones.length}`);
          console.log('EMAIL01_BLOCK_LIFECYCLE_PASS '+JSON.stringify({assignment:a.status,run:r.status,claim:c.status,reservedZones:zones.length}));
          NODE

      - name: Remove transient EMAIL-01 bootstrap
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master'
          git reset --hard origin/master
          git rm .github/workflows/oreshnik-email01-validate-block-next.yml .github/oreshnik-email01-validate-block-next-trigger
          git commit -m "chore(oreshnik): remove transient EMAIL-01 runner"
          git push origin HEAD:master

      - name: Reconcile and dispatch next Goal
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          git reset --hard origin/master
          npm run oreshnik:ready
          ROOT="$RUNNER_TEMP/oreshnik-wt-next"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$ROOT" --repo . --json > "$RUNNER_TEMP/next-init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo . --json | tee "$RUNNER_TEMP/next-reconcile.json"
          node node_modules/oreshnik-cli/dist/cli.js goal --harness chatgpt --auto-align --repo . --max-retries 3 --json | tee "$RUNNER_TEMP/next-goal.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const g=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/next-goal.json','utf8'));
          if(!['assigned','resumed','no_task'].includes(g.result)) throw new Error(`next goal requires recovery: ${g.result}`);
          console.log('NEXT_GOAL_SUMMARY '+JSON.stringify({result:g.result,taskId:g.taskId??null,title:g.title??null,runId:g.runId??null,assignmentId:g.assignmentId??null,functionalBranch:g.functionalBranch??null}));
          NODE

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshnik-email01-block-retry-next
          path: |
            ${{ runner.temp }}/takeover.json
            ${{ runner.temp }}/handoff-revalidate.json
            ${{ runner.temp }}/reconcile-after.json
            ${{ runner.temp }}/next-goal.json
          if-no-files-found: ignore

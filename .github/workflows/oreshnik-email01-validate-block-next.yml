name: Oreshnik EMAIL-01 Projection Repair and Next

on:
  push:
    branches: [master]
    paths:
      - ".github/oreshnik-email01-validate-block-next-trigger"

permissions:
  contents: write
  actions: read

concurrency:
  group: heptacore-oreshnik-email01-projection-repair
  cancel-in-progress: false

env:
  TASK_ID: S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION
  RUN_ID: run-manuel-S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION-20260910144612-ccbed006
  ASSIGNMENT_ID: asg-913a8dde-5aef-4f8b-8731-1af33f2228d9
  ORESHNIK_VERSION: 0.3.0-alpha.6

jobs:
  repair-and-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact controller and preflight
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          npm ci --ignore-scripts
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "$ORESHNIK_VERSION"
          npm run oreshnik:ready
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          git reset --hard origin/master

      - name: Repair standalone Task projection through canonical amendment CAS
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { createCanonicalTaskAmendmentService, taskDigest } from 'oreshnik-cli';
          const taskId=process.env.TASK_ID;
          const expectedHead=execFileSync('git',['rev-parse','origin/master'],{encoding:'utf8'}).trim();
          const board=JSON.parse(execFileSync('git',['show',`origin/master:var/oreshnik/task-board.json`],{encoding:'utf8'}));
          const task=board.tasks.find(x=>x.id===taskId);
          if(!task) throw new Error(`missing ${taskId} from canonical board`);
          if(task.status!=='blocked'||task.blockState?.kind!=='awaiting_external_validation'||task.blockState?.preservedRunId!==process.env.RUN_ID) {
            throw new Error(`canonical board is not the expected preserved external block: ${task.status}`);
          }
          if(task.activeRun) throw new Error('blocked task unexpectedly retains activeRun');
          const expectation='Production email activation remains fail-closed until an owned HeptaCore sender domain is verified in Resend with SPF, DKIM and DMARC evidence.';
          const validationExpectations=[...new Set([...(task.validationExpectations||[]),expectation])];
          const service=createCanonicalTaskAmendmentService(process.cwd());
          const result=service.amend({
            motherBranch:'master',
            expectedHead,
            amendment:{
              schemaVersion:1,
              taskId,
              patch:{validationExpectations},
              reason:'Repair alpha.6 standalone Task projection after native external block and preserve the explicit production-domain validation contract.',
              amendedBy:'manuel',
              amendedAt:new Date().toISOString(),
              expectedTaskDigest:taskDigest(task),
            },
          });
          if(!result.ok) throw new Error(result.error.message);
          console.log('EMAIL01_CANONICAL_AMENDMENT_PASS '+JSON.stringify(result.value));
          NODE

      - name: Verify blocked projection and released resources
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const read=(ref,p)=>JSON.parse(execFileSync('git',['show',`${ref}:${p}`],{encoding:'utf8'}));
          const board=read('origin/master','var/oreshnik/task-board.json');
          const artifact=read('origin/master',`var/oreshnik/tasks/${process.env.TASK_ID}.json`);
          const control=read('origin/oreshnik/control','control-plane.json');
          const task=board.tasks.find(x=>x.id===process.env.TASK_ID);
          const a=(control.assignments||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const r=(control.runs||[]).find(x=>x.runId===process.env.RUN_ID);
          const c=(control.claims||[]).find(x=>x.assignmentId===process.env.ASSIGNMENT_ID);
          const zones=(control.zones||[]).filter(x=>x.assignmentId===process.env.ASSIGNMENT_ID&&x.status==='reserved');
          for(const [name,x] of [['board',task],['artifact',artifact]]) {
            if(!x||x.status!=='blocked'||x.blockState?.kind!=='awaiting_external_validation'||x.blockState?.preservedRunId!==process.env.RUN_ID) throw new Error(`${name} blocked projection incomplete`);
          }
          if(a?.status!=='released'||c?.status!=='released'||zones.length!==0) throw new Error(`resource release incomplete assignment=${a?.status} claim=${c?.status} zones=${zones.length}`);
          if(!r||!['released','blocked'].includes(r.status)) throw new Error(`unexpected preserved run status ${r?.status}`);
          console.log('EMAIL01_BLOCK_CANONICAL_PASS '+JSON.stringify({master:execFileSync('git',['rev-parse','origin/master'],{encoding:'utf8'}).trim(),assignment:a.status,run:r.status,claim:c.status,reservedZones:zones.length}));
          NODE
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo . --json | tee "$RUNNER_TEMP/reconcile-after-repair.json"
          git fetch origin '+refs/heads/master:refs/remotes/origin/master'
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const board=JSON.parse(execFileSync('git',['show','origin/master:var/oreshnik/task-board.json'],{encoding:'utf8'}));
          const artifact=JSON.parse(execFileSync('git',['show',`origin/master:var/oreshnik/tasks/${process.env.TASK_ID}.json`],{encoding:'utf8'}));
          const task=board.tasks.find(x=>x.id===process.env.TASK_ID);
          if(task.status!==artifact.status||JSON.stringify(task.blockState)!==JSON.stringify(artifact.blockState)) throw new Error('post-reconcile board/artifact drift');
          console.log('EMAIL01_POST_RECONCILE_PROJECTION_PASS');
          NODE

      - name: Remove transient EMAIL-01 bootstrap
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master'
          git reset --hard origin/master
          git rm .github/workflows/oreshnik-email01-validate-block-next.yml .github/oreshnik-email01-validate-block-next-trigger
          git commit -m "chore(oreshnik): remove transient EMAIL-01 recovery runner"
          git push origin HEAD:master

      - name: Dispatch next governed Goal
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/master:refs/remotes/origin/master' '+refs/heads/oreshnik/control:refs/remotes/origin/oreshnik/control'
          git reset --hard origin/master
          npm run oreshnik:ready
          ROOT="$RUNNER_TEMP/oreshnik-wt-next"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$ROOT" --repo . --json > "$RUNNER_TEMP/next-init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo . --json > "$RUNNER_TEMP/next-reconcile.json"
          node node_modules/oreshnik-cli/dist/cli.js goal --harness chatgpt --auto-align --repo . --max-retries 3 --json | tee "$RUNNER_TEMP/next-goal.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const g=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/next-goal.json','utf8'));
          if(!['assigned','resumed','no_task'].includes(g.result)) throw new Error(`next goal requires recovery: ${g.result}`);
          console.log('NEXT_GOAL_SUMMARY '+JSON.stringify({result:g.result,taskId:g.taskId??null,title:g.title??null,runId:g.runId??null,assignmentId:g.assignmentId??null,functionalBranch:g.functionalBranch??null}));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oreshnik-email01-projection-repair-next
          path: |
            ${{ runner.temp }}/reconcile-after-repair.json
            ${{ runner.temp }}/next-goal.json
          if-no-files-found: ignore

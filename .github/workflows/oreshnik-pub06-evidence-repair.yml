name: Oreshnik PUB-06 Evidence Completion
on:
  push:
    branches:
      - dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-24.04
    env:
      TASK: S-HC-PUB-06-REELS-STORIES-PUBLISHERS
      RUN_ID: run-manuel-S-HC-PUB-06-REELS-STORIES-PUBLISHERS-20260906155441-d36bde04
      INSTANCE: manuel-chatgpt2
      SESSION: session_93473a46b2904930916a9715222bf6d5
      BRANCH: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove ephemeral workflow and bootstrap controller
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          git rm .github/workflows/oreshnik-pub06-evidence-repair.yml
          git commit -m "chore(ci): remove PUB-06 evidence bootstrap"
          git push origin "HEAD:$BRANCH"
          npm ci --ignore-scripts
          npm run db:generate
      - name: Rehydrate same Run
        id: takeover
        run: |
          set -euo pipefail
          WTROOT="$RUNNER_TEMP/oreshnik-wt-pub06-evidence"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$WTROOT" --repo "$GITHUB_WORKSPACE" --json >/tmp/init.json
          node node_modules/oreshnik-cli/dist/cli.js dispatch takeover \
            --run "$RUN_ID" --reason "Continue same PUB-06 Run to satisfy structured dry-run evidence and governed handoff" \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" --takeover \
            --repo "$GITHUB_WORKSPACE" --json | tee /tmp/takeover.json
          WT="$(node -e 'const x=require("/tmp/takeover.json"); process.stdout.write(x.worktreePath)')"
          test -n "$WT" && test -d "$WT"
          echo "worktree=$WT" >> "$GITHUB_OUTPUT"
      - name: Prepare managed worktree
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          npm ci --ignore-scripts
          TMP="$(mktemp -d)"; cd "$TMP"
          TGZ="$(npm pack @esbuild/linux-x64@0.28.0 --silent)"
          tar -xzf "$TGZ"
          mkdir -p "$WT/node_modules/@esbuild/linux-x64"
          cp -R package/. "$WT/node_modules/@esbuild/linux-x64/"
          cd "$WT"
          npm run db:generate
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
      - name: Record verifiable dry-run gate through Oreshnik runtime service
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node --input-type=module <<'NODE'
          import { createTaskRuntimeService, runStructuredCommand } from 'oreshnik-cli';
          const taskId=process.env.TASK;
          const runId=process.env.RUN_ID;
          const result=await runStructuredCommand('npm',['run','test','-w','@heptacore/integrations'],{
            cwd: process.cwd(), timeout: 180000, gateId: 'dry-run', mirrorOutput: true
          });
          if (!result.passed) {
            console.error(result.stdout); console.error(result.stderr); process.exit(1);
          }
          const runtime=createTaskRuntimeService(process.cwd());
          const recorded=runtime.recordTaskValidationResults({taskId,operator:'manuel',runId,gateResults:[result]});
          if (!recorded.ok) throw new Error(recorded.error.message);
          const dry=recorded.value.evidenceVerifications.find(x=>x.itemId==='dry_run_summary' && x.verified);
          if (!dry) throw new Error('dry_run_summary structured verification was not minted');
          console.log(JSON.stringify(dry,null,2));
          NODE
      - name: Create governed handoff
        id: handoff
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js handoff create \
            --task "$TASK" --run "$RUN_ID" --operator manuel --classification STABLE_COMPLETE \
            --objective "Deliver real Meta Reels and Stories publishing for Instagram and Facebook with dry-run validation and durable transactional finalization." \
            --implemented "Instagram Reel real publisher flow validated" \
            --implemented "Instagram Story image and video real publisher flows validated" \
            --implemented "Facebook Story image and video real publisher flows validated" \
            --implemented "Facebook Reel real publisher flow validated" \
            --implemented "Preview/dry-run validation and fail-closed supportedFormats added" \
            --gate "Provider-specific PUB-06 tests: 8/8 PASS" \
            --gate "typecheck/build/tests/worker/reconcile/diff gates PASS in Actions run 34062221297" \
            --decision "Scheduled parity remains explicitly blocked in PUB-06 and belongs to subsequent parity scope" \
            --next "Integrate PUB-06 through the canonical publishing sprint train after sibling publishing deliveries are ready." \
            --json | tee /tmp/handoff.json
          MD="$(node -e 'const x=require("/tmp/handoff.json"); process.stdout.write(x.markdownPath || x.reference?.markdownPath || "")')"
          test -n "$MD" && test -f "$MD"
          echo "markdown=$MD" >> "$GITHUB_OUTPUT"
      - name: Persist handoff and explicit evidence context
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          MD='${{ steps.handoff.outputs.markdown }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js evidence \
            --task "$TASK" --run "$RUN_ID" --operator manuel --handoff "$MD" \
            --details "integration test output: PUB-06 provider-specific suite passed 8/8; dry-run summary: mocked provider dry-run and format validation passed for Instagram Reel/Story and Facebook Reel/Story without live provider mutation; endpoint verification: Meta Graph request contracts for STORIES, REELS, photo_stories, video_stories and video_reels were asserted by provider-specific tests." \
            --start-validation
          git add var/oreshnik docs/oreshnik docs/07_handoffs docs/obsidian-vault 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(oreshnik): persist PUB-06 structured evidence and handoff"; fi
          git push origin "HEAD:$BRANCH"
      - name: Ready for integration
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          MD='${{ steps.handoff.outputs.markdown }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js evidence \
            --task "$TASK" --run "$RUN_ID" --operator manuel --handoff "$MD" \
            --details "PUB-06 validation complete: 8/8 provider tests plus typecheck, build, worker and full test suite pass; structured dry-run evidence and governed handoff persisted." \
            --ready-for-integration
          git add var/oreshnik docs/oreshnik docs/07_handoffs docs/obsidian-vault 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(oreshnik): PUB-06 ready for integration"; fi
          git push origin "HEAD:$BRANCH"
      - name: Release dispatcher resources and select next work
        run: |
          set -euo pipefail
          node node_modules/oreshnik-cli/dist/cli.js dispatch release \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" --run "$RUN_ID" \
            --repo "$GITHUB_WORKSPACE" --json | tee /tmp/release.json
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo "$GITHUB_WORKSPACE" --json | tee /tmp/reconcile.json
          node node_modules/oreshnik-cli/dist/cli.js dispatch peek \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" \
            --repo "$GITHUB_WORKSPACE" --json | tee /tmp/peek.json

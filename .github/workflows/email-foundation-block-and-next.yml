name: Email Foundation Blocked-External Handoff

on:
  push:
    branches:
      - ops/email-foundation-block-and-next
    paths:
      - .github/workflows/email-foundation-block-and-next.yml

permissions:
  contents: write

jobs:
  block-email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TASK_ID: S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION
      RUN_ID: run-manuel-S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION-20260905180153-1e9c8316
      OPERATOR: manuel
      HARNESS: chatgpt
      INSTANCE: manuel-chatgpt1
      SESSION: session_1d4bac9cf36943759bf3bc4272dd5105
      HANDOFF_PATH: var/oreshnik/handoffs/S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION/handoff-20260905T203611929Z-9fe1de71d50a.json
      HANDOFF_DIGEST: c0e8dfdf01cfff3803c646dd25e76f4d5e639f1862094c25bded19610fab2dde
      ORESHNIK_LOCAL_STATE_DIR: /tmp/oreshnik-local-state
    steps:
      - name: Checkout operations scaffold
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.name "Oreshnik ChatGPT Operator"
          git config --global user.email "oreshnik-bot@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact alpha6 CLI
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "0.3.0-alpha.6"

      - name: Register ephemeral dispatcher machine
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js"
          node "$CLI" dispatch init \
            --mother master \
            --worktree-root "$RUNNER_TEMP/oreshnik-wt-email" \
            --repo "$GITHUB_WORKSPACE" \
            --json | tee /tmp/dispatch-init.json

      - name: Rehydrate exact governed email Run
        id: takeover
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js"
          node "$CLI" dispatch takeover \
            --run "$RUN_ID" \
            --reason "Finish owner-deferred production-domain block using the already validated handoff" \
            --operator "$OPERATOR" \
            --harness "$HARNESS" \
            --instance "$INSTANCE" \
            --session "$SESSION" \
            --repo "$GITHUB_WORKSPACE" \
            --json | tee /tmp/takeover.json
          WT="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/takeover.json","utf8"));process.stdout.write(x.worktreePath)')"
          test -n "$WT"
          echo "worktree=$WT" >> "$GITHUB_OUTPUT"
          git -C "$WT" fetch origin --prune
          test "$(git -C "$WT" branch --show-current)" = "dispatch/manuel/manuel-chatgpt1/email-infra/S-HC-EMAIL-01-TRANSACTIONAL-FOUNDATION/3294b78874"
          test -f "$ORESHNIK_LOCAL_STATE_DIR/agent-instances.json"
          test -f "$ORESHNIK_LOCAL_STATE_DIR/execution-sessions.json"

      - name: Verify the already persisted BLOCKED_EXTERNAL handoff
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          CLI="$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js"
          cd "$WT"
          test -f "$HANDOFF_PATH"
          node "$CLI" handoff validate --path "$HANDOFF_PATH" --json | tee /tmp/handoff-validated.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/handoff-validated.json','utf8'));
          if (!x.valid) throw new Error('handoff is not valid');
          if (x.digest !== process.env.HANDOFF_DIGEST) throw new Error(`handoff digest changed: ${x.digest}`);
          NODE

      - name: Prove alpha6 legacy repository-id compatibility defect
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createDispatchControlPlaneService, createExecutionContextResolver } from './node_modules/oreshnik-cli/dist/index.js';

          const stateDir=process.env.ORESHNIK_LOCAL_STATE_DIR;
          const takeover=JSON.parse(fs.readFileSync('/tmp/takeover.json','utf8'));
          const machineId=fs.readFileSync(`${stateDir}/machine-id`,'utf8').trim();
          const instances=JSON.parse(fs.readFileSync(`${stateDir}/agent-instances.json`,'utf8'));
          const sessions=JSON.parse(fs.readFileSync(`${stateDir}/execution-sessions.json`,'utf8'));
          const instance=instances.find(x=>x.agentInstanceUid===takeover.agentInstanceUid);
          const session=sessions.find(x=>x.sessionId===process.env.SESSION);
          const identity=createDispatchControlPlaneService(process.env.GITHUB_WORKSPACE).repositoryIdentity();
          if (!identity.ok) throw new Error(identity.error.message);
          console.log(JSON.stringify({
            controlPlaneLegacyRepositoryId: instance?.repositoryId,
            canonicalResolverRepositoryId: identity.value.repositoryId,
            machineId,
            takeoverMachineId:takeover.machineId,
            uid:instance?.agentInstanceUid,
            alias:instance?.displayAlias,
            sessionId:session?.sessionId,
          },null,2));
          if (!instance || !session) throw new Error('takeover local identity was not hydrated');
          if (machineId!==takeover.machineId || instance.machineId!==machineId || session.machineId!==machineId) throw new Error('machine identity mismatch');
          if (instance.repositoryId===identity.value.repositoryId) throw new Error('expected legacy/canonical repository-id mismatch was not reproduced');

          const resolved=createExecutionContextResolver(process.env.GITHUB_WORKSPACE).resolve({
            explicitOperator:process.env.OPERATOR,
            explicitHarness:process.env.HARNESS,
            explicitInstance:process.env.INSTANCE,
            explicitSession:process.env.SESSION,
            allowCreateInstance:false,
            requireSession:true,
          });
          console.log(JSON.stringify({preShimResolver:resolved},null,2));
          if (resolved.ok) throw new Error('resolver unexpectedly succeeded before compatibility hydration');
          if (!resolved.error.message.includes('is not available')) throw new Error(`unexpected resolver failure: ${resolved.error.message}`);
          fs.writeFileSync('/tmp/canonical-repository-id',identity.value.repositoryId,'utf8');
          NODE

      - name: Rehydrate local identity with canonical repository id using Oreshnik helper
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createExecutionContextResolver } from './node_modules/oreshnik-cli/dist/index.js';
          import { hydrateEphemeralTakeoverLocalState } from './node_modules/oreshnik-cli/dist/core/ephemeral-takeover-local-state.js';

          const takeover=JSON.parse(fs.readFileSync('/tmp/takeover.json','utf8'));
          const canonicalRepositoryId=fs.readFileSync('/tmp/canonical-repository-id','utf8').trim();
          const context={
            operatorId:process.env.OPERATOR,
            harnessId:process.env.HARNESS,
            agentInstanceUid:takeover.agentInstanceUid,
            agentInstanceAlias:takeover.agentInstanceAlias,
            sessionId:process.env.SESSION,
            machineId:takeover.machineId,
            repositoryId:canonicalRepositoryId,
            identityOrigin:'explicit',
            instanceCreated:false,
            sessionCreated:false,
            sources:{operator:'flag',harness:'flag',instance:'flag',session:'flag'},
          };
          const hydrated=hydrateEphemeralTakeoverLocalState(context,process.env.ORESHNIK_LOCAL_STATE_DIR);
          console.log(JSON.stringify({compatibilityHydration:hydrated,canonicalRepositoryId},null,2));
          if (!hydrated.ok) throw new Error(hydrated.error.message);
          const resolved=createExecutionContextResolver(process.env.GITHUB_WORKSPACE).resolve({
            explicitOperator:process.env.OPERATOR,
            explicitHarness:process.env.HARNESS,
            explicitInstance:process.env.INSTANCE,
            explicitSession:process.env.SESSION,
            allowCreateInstance:false,
            requireSession:true,
          });
          console.log(JSON.stringify({postShimResolver:resolved},null,2));
          if (!resolved.ok) throw new Error(`resolver still fails after Oreshnik compatibility hydration: ${resolved.error.message}`);
          if (resolved.value.agentInstanceUid!==takeover.agentInstanceUid || resolved.value.sessionId!==process.env.SESSION) throw new Error('compatibility hydration changed preserved identity');
          NODE

      - name: Block deferred production activation from dispatcher root
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js"
          cd "$GITHUB_WORKSPACE"
          node "$CLI" task block \
            --task "$TASK_ID" \
            --run "$RUN_ID" \
            --operator "$OPERATOR" \
            --harness "$HARNESS" \
            --instance "$INSTANCE" \
            --session "$SESSION" \
            --kind awaiting_external_validation \
            --reason "Owner deferred official HeptaCore sender domain until development is complete; software foundation is validated and Vercel remains the temporary web origin." \
            --external-action "Select/purchase official HeptaCore domain and verify Resend SPF, DKIM and DMARC before production email activation." \
            --resume-policy explicit_authorization_required \
            --repo "$GITHUB_WORKSPACE"

      - name: Persist functional runtime projection
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          mapfile -t dirty < <(git status --porcelain | sed 's/^...//')
          for p in "${dirty[@]}"; do
            case "$p" in
              var/oreshnik/*|docs/oreshnik/handoffs/*) ;;
              *) echo "Unexpected dirty path after task block: $p"; exit 41;;
            esac
          done
          git add var/oreshnik docs/oreshnik/handoffs || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(email): persist deferred production-domain block"
            git push origin HEAD
          fi

      - name: Verify canonical blocked/released state
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/node_modules/oreshnik-cli/dist/cli.js"
          cd "$GITHUB_WORKSPACE"
          git fetch origin master oreshnik/control --prune
          node "$CLI" dispatch status --repo "$GITHUB_WORKSPACE" --json | tee /tmp/status-after.json
          node "$CLI" dispatch reconcile --repo "$GITHUB_WORKSPACE" --json | tee /tmp/reconcile-after.json
          git fetch origin master oreshnik/control --prune
          git show "origin/master:var/oreshnik/tasks/$TASK_ID.json" > /tmp/email-task.json
          node - <<'NODE'
          const fs=require('fs');
          const run=process.env.RUN_ID;
          const status=JSON.parse(fs.readFileSync('/tmp/status-after.json','utf8'));
          const assignment=(status.assignments||[]).find(x=>x.runId===run);
          const runState=(status.runs||[]).find(x=>x.runId===run);
          if (!assignment || assignment.status !== 'released') throw new Error(`assignment not released: ${assignment?.status}`);
          if (!runState || runState.status !== 'released') throw new Error(`run not released: ${runState?.status}`);
          const task=JSON.parse(fs.readFileSync('/tmp/email-task.json','utf8'));
          if (task.status !== 'blocked') throw new Error(`task not blocked: ${task.status}`);
          if (task.blockState?.preservedRunId !== run) throw new Error(`preserved run mismatch: ${task.blockState?.preservedRunId}`);
          if (task.blockState?.kind !== 'awaiting_external_validation') throw new Error(`block kind mismatch: ${task.blockState?.kind}`);
          console.log(JSON.stringify({task:task.status,block:task.blockState.kind,assignment:assignment.status,run:runState.status},null,2));
          NODE

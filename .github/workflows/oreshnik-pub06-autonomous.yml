name: Oreshnik PUB-06 Autonomous Delivery

on:
  push:
    branches:
      - dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
    paths:
      - ".github/workflows/oreshnik-pub06-autonomous.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: heptacore-pub06-autonomous
  cancel-in-progress: false

env:
  FUNCTIONAL_BRANCH: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout governed functional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FUNCTIONAL_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure identity
        run: |
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Implement PUB-06 inside governed zones
        shell: bash
        run: |
          set -euo pipefail

          cat > apps/web/lib/publishers/types.ts <<'EOF'
          export interface PublisherCapabilities {
            textOnly: boolean;
            image: boolean;
            video: boolean;
            carousel: boolean;
            story: boolean;
            reels: boolean;
            scheduling: boolean;
          }

          export interface PublishInput {
            targetId: string;
            accessToken: string;
            mediaUrl?: string | null;
            caption: string;
            format?: string | null;
            mediaType?: "IMAGE" | "VIDEO" | "CAROUSEL";
          }

          export interface PublishResult {
            externalPostId: string;
            providerResponse: unknown;
          }

          export interface ProviderErrorMeta {
            code?: number;
            subcode?: number;
            fbtrace?: string;
            type?: string;
            httpStatus?: number;
          }

          export class ProviderError extends Error {
            readonly meta: ProviderErrorMeta;
            readonly isAmbiguous: boolean;

            constructor(message: string, meta: ProviderErrorMeta & { isAmbiguous?: boolean }) {
              super(message);
              this.name = "ProviderError";
              this.meta = { code: meta.code, subcode: meta.subcode, fbtrace: meta.fbtrace, type: meta.type, httpStatus: meta.httpStatus };
              this.isAmbiguous = meta.isAmbiguous ?? false;
            }
          }

          export interface Publisher {
            readonly network: string;
            readonly capabilities: PublisherCapabilities;
            readonly credentialLabel: string;
            readonly requiredScopes: string[];
            readonly supportedFormats: readonly string[];
            publish(input: PublishInput): Promise<PublishResult>;
          }
          EOF

          cat > apps/web/lib/publishers/instagram.ts <<'EOF'
          import { publishInstagramMedia, waitForInstagramContainerReady } from "../instagram-publisher";
          import { ProviderError, type PublishInput, type PublishResult, type Publisher, type PublisherCapabilities } from "./types";

          const capabilities: PublisherCapabilities = {
            textOnly: false,
            image: true,
            video: true,
            carousel: false,
            story: true,
            reels: true,
            scheduling: false,
          };

          function metaError(json: unknown, status: number): ProviderError {
            const record = json as Record<string, unknown>;
            const err = record?.error as Record<string, unknown> | undefined;
            const code = err?.code as number | undefined;
            const subcode = err?.error_subcode as number | undefined;
            const message = String(err?.message ?? `Instagram HTTP ${status}`);
            return new ProviderError(message, {
              code,
              subcode,
              type: err?.type as string | undefined,
              fbtrace: (record?.fbtrace_id ?? err?.fbtrace_id) as string | undefined,
              httpStatus: status,
              isAmbiguous: code === 1 || status >= 500,
            });
          }

          async function publishInstagramStory(input: PublishInput): Promise<PublishResult> {
            if (!input.mediaUrl) throw new Error("Instagram Story requires mediaUrl");
            if (input.mediaType !== "IMAGE" && input.mediaType !== "VIDEO") {
              throw new Error("Instagram Story requires an image or video asset");
            }

            const apiVersion = process.env.INSTAGRAM_GRAPH_API_VERSION || "v25.0";
            const baseUrl = `https://graph.instagram.com/${apiVersion}`;
            const createParams = new URLSearchParams();
            createParams.append("access_token", input.accessToken);
            createParams.append("media_type", "STORIES");
            if (input.mediaType === "VIDEO") createParams.append("video_url", input.mediaUrl);
            else createParams.append("image_url", input.mediaUrl);

            const createRes = await fetch(`${baseUrl}/me/media`, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: createParams.toString(),
            });
            const createJson = await createRes.json() as Record<string, unknown>;
            if (!createRes.ok || !createJson.id) throw metaError(createJson, createRes.status);

            const containerId = createJson.id as string;
            const deadlineMs = Date.now() + 50_000;
            const ready = await waitForInstagramContainerReady({
              containerId,
              accessToken: input.accessToken,
              apiVersion,
              deadlineMs,
            });
            if (!ready.ready) {
              throw new Error(`Instagram Story container not publishable: ${ready.statusCode ?? "unknown"}`);
            }

            const publishOnce = async () => {
              const params = new URLSearchParams();
              params.append("creation_id", containerId);
              params.append("access_token", input.accessToken);
              const res = await fetch(`${baseUrl}/me/media_publish`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params.toString(),
              });
              const json = await res.json() as Record<string, unknown>;
              return { res, json };
            };

            let attempt = await publishOnce();
            if (!attempt.res.ok) {
              const err = attempt.json.error as Record<string, unknown> | undefined;
              if (err?.code === 9007 && err?.error_subcode === 2207027) {
                const retryReady = await waitForInstagramContainerReady({
                  containerId,
                  accessToken: input.accessToken,
                  apiVersion,
                  deadlineMs,
                });
                if (!retryReady.ready) throw new Error("Instagram Story container remained unavailable on retry");
                attempt = await publishOnce();
              }
            }
            if (!attempt.res.ok || !attempt.json.id) throw metaError(attempt.json, attempt.res.status);

            return {
              externalPostId: attempt.json.id as string,
              providerResponse: {
                type: input.mediaType === "VIDEO" ? "video_story" : "image_story",
                containerId,
                status: attempt.res.status,
              },
            };
          }

          async function publishViaInstagram(input: PublishInput): Promise<PublishResult> {
            const format = String(input.format ?? "INSTAGRAM_FEED").toUpperCase();
            if (format === "INSTAGRAM_STORY") return publishInstagramStory(input);

            const result = await publishInstagramMedia({
              igUserId: input.targetId,
              accessToken: input.accessToken,
              mediaUrl: input.mediaUrl!,
              caption: input.caption,
              mediaType: input.mediaType,
            });
            return { externalPostId: result.externalPostId, providerResponse: result.providerResponse };
          }

          export const instagramPublisher: Publisher = {
            network: "INSTAGRAM",
            capabilities,
            credentialLabel: "instagram_oauth",
            requiredScopes: ["instagram_business_content_publish"],
            supportedFormats: ["INSTAGRAM_FEED", "INSTAGRAM_STORY", "INSTAGRAM_REEL"],
            publish: publishViaInstagram,
          };
          EOF

          cat > apps/web/lib/publishers/facebook-page.ts <<'EOF'
          import { ProviderError, type PublishInput, type PublishResult, type Publisher, type PublisherCapabilities } from "./types";

          function formatMetaError(resJson: unknown, status: number): string {
            const err = (resJson as Record<string, unknown>)?.error as Record<string, unknown> | undefined;
            if (!err) return `HTTP ${status}: unknown error`;
            const parts: string[] = [];
            if (err.message) parts.push(String(err.message));
            if (err.type) parts.push(`type=${err.type}`);
            if (err.code) parts.push(`code=${err.code}`);
            if (err.error_subcode) parts.push(`subcode=${err.error_subcode}`);
            const fbtrace = (resJson as Record<string, unknown>)?.fbtrace_id ?? err.fbtrace_id;
            if (fbtrace) parts.push(`trace=${fbtrace}`);
            return parts.join(" | ") || `HTTP ${status}: error without details`;
          }

          function providerErrorFromJson(json: unknown, status: number): ProviderError {
            const err = (json as Record<string, unknown>)?.error as Record<string, unknown> | undefined;
            const code = err?.code as number | undefined;
            return new ProviderError(formatMetaError(json, status), {
              code,
              subcode: err?.error_subcode as number | undefined,
              type: err?.type as string | undefined,
              fbtrace: ((json as Record<string, unknown>)?.fbtrace_id ?? err?.fbtrace_id) as string | undefined,
              httpStatus: status,
              isAmbiguous: code === 1 || status >= 500,
            });
          }

          async function postForm(url: string, params: URLSearchParams): Promise<Record<string, unknown>> {
            const res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: params.toString(),
            });
            const json = await res.json() as Record<string, unknown>;
            if (!res.ok) throw providerErrorFromJson(json, res.status);
            return json;
          }

          async function initializeVideoSession(
            baseUrl: string,
            pageId: string,
            edge: "video_stories" | "video_reels",
            accessToken: string,
          ): Promise<{ videoId: string; uploadUrl: string }> {
            const params = new URLSearchParams();
            params.append("upload_phase", "start");
            params.append("access_token", accessToken);
            const json = await postForm(`${baseUrl}/${pageId}/${edge}`, params);
            const videoId = json.video_id as string | undefined;
            const uploadUrl = json.upload_url as string | undefined;
            if (!videoId || !uploadUrl) throw new Error(`${edge} initialization did not return video_id/upload_url`);
            return { videoId, uploadUrl };
          }

          async function uploadHostedVideo(uploadUrl: string, mediaUrl: string, accessToken: string): Promise<void> {
            const res = await fetch(uploadUrl, {
              method: "POST",
              headers: {
                Authorization: `OAuth ${accessToken}`,
                file_url: mediaUrl,
              },
            });
            if (!res.ok) {
              const text = await res.text().catch(() => "");
              throw new ProviderError(`Meta hosted video upload failed: HTTP ${res.status}${text ? ` | ${text}` : ""}`, {
                httpStatus: res.status,
                isAmbiguous: res.status >= 500,
              });
            }
          }

          async function publishFacebookFeed(baseUrl: string, pageId: string, input: PublishInput): Promise<PublishResult> {
            const { accessToken, mediaUrl, caption, mediaType } = input;
            if (!mediaUrl || (!mediaType && caption)) {
              const params = new URLSearchParams();
              params.append("message", caption);
              params.append("access_token", accessToken);
              const json = await postForm(`${baseUrl}/${pageId}/feed`, params);
              if (!json.id) throw new Error("Facebook feed publish did not return id");
              return { externalPostId: json.id as string, providerResponse: { feed: true } };
            }

            if (mediaType === "VIDEO") {
              const params = new URLSearchParams();
              params.append("file_url", mediaUrl);
              params.append("description", caption);
              params.append("access_token", accessToken);
              const apiVersion = process.env.FACEBOOK_GRAPH_API_VERSION || "v25.0";
              const json = await postForm(`https://graph-video.facebook.com/${apiVersion}/${pageId}/videos`, params);
              if (!json.id) throw new Error("Facebook video publish did not return id");
              return {
                externalPostId: (json.post_id as string | undefined) || (json.id as string),
                providerResponse: { type: "video", postId: json.post_id ?? null, videoId: json.id },
              };
            }

            const params = new URLSearchParams();
            params.append("url", mediaUrl);
            params.append("caption", caption);
            params.append("published", "true");
            params.append("access_token", accessToken);
            const json = await postForm(`${baseUrl}/${pageId}/photos`, params);
            if (!json.id) throw new Error("Facebook photo publish did not return id");
            return {
              externalPostId: (json.post_id as string | undefined) || (json.id as string),
              providerResponse: { type: "photo", postId: json.post_id ?? null, photoId: json.id },
            };
          }

          async function publishFacebookStory(baseUrl: string, pageId: string, input: PublishInput): Promise<PublishResult> {
            if (!input.mediaUrl) throw new Error("Facebook Story requires mediaUrl");
            if (input.mediaType === "VIDEO") {
              const session = await initializeVideoSession(baseUrl, pageId, "video_stories", input.accessToken);
              await uploadHostedVideo(session.uploadUrl, input.mediaUrl, input.accessToken);
              const params = new URLSearchParams();
              params.append("video_id", session.videoId);
              params.append("upload_phase", "finish");
              params.append("access_token", input.accessToken);
              const json = await postForm(`${baseUrl}/${pageId}/video_stories`, params);
              return {
                externalPostId: (json.post_id as string | undefined) || session.videoId,
                providerResponse: { type: "video_story", storyId: json.post_id ?? null, videoId: session.videoId },
              };
            }
            if (input.mediaType !== "IMAGE") throw new Error("Facebook Story requires an image or video asset");

            const uploadParams = new URLSearchParams();
            uploadParams.append("url", input.mediaUrl);
            uploadParams.append("published", "false");
            uploadParams.append("access_token", input.accessToken);
            const uploadJson = await postForm(`${baseUrl}/${pageId}/photos`, uploadParams);
            const photoId = uploadJson.id as string | undefined;
            if (!photoId) throw new Error("Facebook Story photo upload did not return id");

            const storyParams = new URLSearchParams();
            storyParams.append("photo_id", photoId);
            storyParams.append("access_token", input.accessToken);
            const storyJson = await postForm(`${baseUrl}/${pageId}/photo_stories`, storyParams);
            return {
              externalPostId: (storyJson.post_id as string | undefined) || photoId,
              providerResponse: { type: "photo_story", storyId: storyJson.post_id ?? null, photoId },
            };
          }

          async function publishFacebookReel(baseUrl: string, pageId: string, input: PublishInput): Promise<PublishResult> {
            if (!input.mediaUrl || input.mediaType !== "VIDEO") throw new Error("Facebook Reel requires a video asset");
            const session = await initializeVideoSession(baseUrl, pageId, "video_reels", input.accessToken);
            await uploadHostedVideo(session.uploadUrl, input.mediaUrl, input.accessToken);
            const params = new URLSearchParams();
            params.append("video_id", session.videoId);
            params.append("upload_phase", "finish");
            params.append("video_state", "PUBLISHED");
            if (input.caption) params.append("description", input.caption);
            params.append("access_token", input.accessToken);
            const json = await postForm(`${baseUrl}/${pageId}/video_reels`, params);
            return {
              externalPostId: (json.post_id as string | undefined) || session.videoId,
              providerResponse: { type: "reel", reelId: json.post_id ?? null, videoId: session.videoId },
            };
          }

          const capabilities: PublisherCapabilities = {
            textOnly: true,
            image: true,
            video: true,
            carousel: false,
            story: true,
            reels: true,
            scheduling: false,
          };

          async function publishToFacebookPage(input: PublishInput): Promise<PublishResult> {
            const apiVersion = process.env.FACEBOOK_GRAPH_API_VERSION || "v25.0";
            const baseUrl = `https://graph.facebook.com/${apiVersion}`;
            const format = String(input.format ?? "FACEBOOK_FEED").toUpperCase();
            if (format === "FACEBOOK_STORY") return publishFacebookStory(baseUrl, input.targetId, input);
            if (format === "FACEBOOK_REEL") return publishFacebookReel(baseUrl, input.targetId, input);
            return publishFacebookFeed(baseUrl, input.targetId, input);
          }

          export const facebookPagePublisher: Publisher = {
            network: "FACEBOOK",
            capabilities,
            credentialLabel: "facebook_page_oauth",
            requiredScopes: ["pages_show_list", "pages_read_engagement", "pages_manage_posts"],
            supportedFormats: ["FACEBOOK_FEED", "FACEBOOK_STORY", "FACEBOOK_REEL"],
            publish: publishToFacebookPage,
          };
          EOF

          cat > apps/web/app/api/publishing/pub06-formats.ts <<'EOF'
          import {
            buildMultiformatDryRun,
            inferMimeType,
            type DraftFormatAsset,
            type PublishingFormat,
          } from "../../../lib/publishing-formats";

          export type Pub06PublishingFormat = PublishingFormat | "INSTAGRAM_REEL" | "FACEBOOK_STORY" | "FACEBOOK_REEL";

          const NEW_FORMATS = new Set<Pub06PublishingFormat>(["INSTAGRAM_REEL", "FACEBOOK_STORY", "FACEBOOK_REEL"]);

          export function normalizePub06PublishingFormat(network: string, value?: string | null): Pub06PublishingFormat {
            const raw = String(value ?? "").trim().toUpperCase();
            if (network === "FACEBOOK") {
              if (raw.includes("REEL")) return "FACEBOOK_REEL";
              if (raw.includes("STORY") || raw.includes("HISTORIA")) return "FACEBOOK_STORY";
              return "FACEBOOK_FEED";
            }
            if (raw.includes("REEL")) return "INSTAGRAM_REEL";
            if (raw.includes("CAROUSEL") || raw.includes("CARRUSEL")) return "INSTAGRAM_CAROUSEL";
            if (raw.includes("STORY") || raw.includes("HISTORIA")) return "INSTAGRAM_STORY";
            return "INSTAGRAM_FEED";
          }

          type NewRule = {
            platform: "INSTAGRAM" | "FACEBOOK";
            label: string;
            aspectRatio: string;
            safeAreas: { topPercent: number; bottomPercent: number; sidePercent: number };
            acceptedMimeTypes: string[];
            ratio: number;
            tolerance: number;
            minWidth: number;
            minHeight: number;
            minDurationSeconds?: number;
            maxDurationSeconds: number;
            maxSizeBytes?: number;
          };

          const RULES: Record<"INSTAGRAM_REEL" | "FACEBOOK_STORY" | "FACEBOOK_REEL", NewRule> = {
            INSTAGRAM_REEL: {
              platform: "INSTAGRAM",
              label: "Instagram Reel",
              aspectRatio: "9 / 16",
              safeAreas: { topPercent: 10, bottomPercent: 14, sidePercent: 5 },
              acceptedMimeTypes: ["video/mp4", "video/quicktime"],
              ratio: 9 / 16,
              tolerance: 0.04,
              minWidth: 540,
              minHeight: 960,
              minDurationSeconds: 3,
              maxDurationSeconds: 900,
              maxSizeBytes: 1024 * 1024 * 1024,
            },
            FACEBOOK_STORY: {
              platform: "FACEBOOK",
              label: "Facebook Story",
              aspectRatio: "9 / 16",
              safeAreas: { topPercent: 13, bottomPercent: 16, sidePercent: 5 },
              acceptedMimeTypes: ["image/jpeg", "image/png", "image/webp", "video/mp4", "video/quicktime"],
              ratio: 9 / 16,
              tolerance: 0.06,
              minWidth: 540,
              minHeight: 960,
              maxDurationSeconds: 60,
            },
            FACEBOOK_REEL: {
              platform: "FACEBOOK",
              label: "Facebook Reel",
              aspectRatio: "9 / 16",
              safeAreas: { topPercent: 10, bottomPercent: 14, sidePercent: 5 },
              acceptedMimeTypes: ["video/mp4", "video/quicktime"],
              ratio: 9 / 16,
              tolerance: 0.03,
              minWidth: 540,
              minHeight: 960,
              minDurationSeconds: 4,
              maxDurationSeconds: 60,
            },
          };

          export function buildPub06DryRun(format: Pub06PublishingFormat, assets: DraftFormatAsset[]) {
            if (!NEW_FORMATS.has(format)) return buildMultiformatDryRun(format as PublishingFormat, assets);
            const rule = RULES[format as keyof typeof RULES];
            const errors: Array<{ code: string; message: string; assetId?: string }> = [];
            const warnings: Array<{ code: string; message: string; assetId?: string }> = [];

            if (assets.length !== 1) {
              errors.push({ code: "ASSET_COUNT", message: `${rule.label} requires exactly one asset.` });
            }
            for (const asset of assets) {
              const mimeType = inferMimeType(asset);
              if (!mimeType || !rule.acceptedMimeTypes.includes(mimeType)) {
                errors.push({ code: "ASSET_MIME", assetId: asset.id, message: `${rule.label} does not support ${mimeType ?? "unknown"}.` });
              }
              if (asset.width != null && asset.height != null) {
                if (asset.width < rule.minWidth || asset.height < rule.minHeight) {
                  errors.push({ code: "ASSET_DIMENSIONS", assetId: asset.id, message: `${rule.label} requires at least ${rule.minWidth}x${rule.minHeight}.` });
                }
                const ratio = asset.width / asset.height;
                if (Math.abs(ratio - rule.ratio) > rule.tolerance) {
                  errors.push({ code: "ASSET_ASPECT_RATIO", assetId: asset.id, message: `${rule.label} requires a 9:16 asset.` });
                }
              } else {
                warnings.push({ code: "ASSET_DIMENSIONS_UNKNOWN", assetId: asset.id, message: "Asset dimensions are not stored." });
              }
              if (rule.maxSizeBytes != null) {
                if (asset.sizeBytes != null && asset.sizeBytes > rule.maxSizeBytes) {
                  errors.push({ code: "ASSET_SIZE", assetId: asset.id, message: `${rule.label} exceeds the provider file-size limit.` });
                } else if (asset.sizeBytes == null) {
                  warnings.push({ code: "ASSET_SIZE_UNKNOWN", assetId: asset.id, message: "Asset file size is not stored." });
                }
              }
              if ((mimeType ?? "").startsWith("video/")) {
                if (asset.durationSeconds == null) {
                  warnings.push({ code: "ASSET_DURATION_UNKNOWN", assetId: asset.id, message: "Video duration is not stored." });
                } else {
                  if (rule.minDurationSeconds != null && asset.durationSeconds < rule.minDurationSeconds) {
                    errors.push({ code: "ASSET_DURATION_MIN", assetId: asset.id, message: `${rule.label} video is too short.` });
                  }
                  if (asset.durationSeconds > rule.maxDurationSeconds) {
                    errors.push({ code: "ASSET_DURATION_MAX", assetId: asset.id, message: `${rule.label} video exceeds ${rule.maxDurationSeconds}s.` });
                  }
                }
              }
            }

            return {
              valid: errors.length === 0,
              errors,
              warnings,
              format,
              assets,
              previewData: {
                platform: rule.platform,
                format,
                label: rule.label,
                aspectRatio: rule.aspectRatio,
                safeAreas: rule.safeAreas,
                assets,
              },
            };
          }
          EOF

          cat > packages/integrations/src/meta-publishers.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { afterEach, describe, it } from "node:test";
          import { facebookPagePublisher } from "../../../apps/web/lib/publishers/facebook-page.js";
          import { instagramPublisher } from "../../../apps/web/lib/publishers/instagram.js";
          import { buildPub06DryRun, normalizePub06PublishingFormat } from "../../../apps/web/app/api/publishing/pub06-formats.js";

          function response(status = 200, json: unknown = {}, text = "ok"): Response {
            return {
              ok: status >= 200 && status < 300,
              status,
              json: async () => json,
              text: async () => text,
            } as Response;
          }

          afterEach(() => {
            delete process.env.FACEBOOK_GRAPH_API_VERSION;
            delete process.env.INSTAGRAM_GRAPH_API_VERSION;
            delete (globalThis as { fetch?: typeof fetch }).fetch;
          });

          describe("PUB-06 format contract", () => {
            it("normalizes and advertises only validated Meta formats", () => {
              assert.equal(normalizePub06PublishingFormat("INSTAGRAM", "reel"), "INSTAGRAM_REEL");
              assert.equal(normalizePub06PublishingFormat("FACEBOOK", "story"), "FACEBOOK_STORY");
              assert.equal(normalizePub06PublishingFormat("FACEBOOK", "reel"), "FACEBOOK_REEL");
              assert.deepEqual(instagramPublisher.supportedFormats, ["INSTAGRAM_FEED", "INSTAGRAM_STORY", "INSTAGRAM_REEL"]);
              assert.deepEqual(facebookPagePublisher.supportedFormats, ["FACEBOOK_FEED", "FACEBOOK_STORY", "FACEBOOK_REEL"]);
              assert.equal(instagramPublisher.capabilities.story, true);
              assert.equal(facebookPagePublisher.capabilities.reels, true);
            });

            it("rejects an image masquerading as a Facebook Reel during dry-run", () => {
              const result = buildPub06DryRun("FACEBOOK_REEL", [{
                id: "asset-1", url: "https://cdn.test/a.jpg", filename: "a.jpg", mimeType: "image/jpeg",
                width: 1080, height: 1920, sizeBytes: 1000, durationSeconds: null, order: 1,
              }]);
              assert.equal(result.valid, false);
              assert.ok(result.errors.some((error) => error.code === "ASSET_MIME"));
            });
          });

          describe("Instagram Stories and Reels", () => {
            it("publishes an Instagram image Story with STORIES media_type", async () => {
              const calls: Array<{ url: string; body: string }> = [];
              (globalThis as { fetch: typeof fetch }).fetch = (async (url: string | URL, init?: RequestInit) => {
                const href = String(url);
                calls.push({ url: href, body: typeof init?.body === "string" ? init.body : "" });
                if (href.endsWith("/me/media")) return response(200, { id: "container-story-image" });
                if (href.includes("container-story-image?fields=status_code,status")) return response(200, { id: "container-story-image", status_code: "FINISHED" });
                if (href.endsWith("/me/media_publish")) return response(200, { id: "ig-story-image" });
                throw new Error(`Unexpected ${href}`);
              }) as typeof fetch;

              const result = await instagramPublisher.publish({

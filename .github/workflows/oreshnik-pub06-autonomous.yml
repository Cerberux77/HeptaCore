      - name: Commit governed candidate and remove ephemeral workflow
        run: |
          set -euo pipefail
          git add apps/web/lib/publishers apps/web/app/api/publishing packages/integrations
          git commit -m "feat(publishing): complete Meta Stories and Reels publishers"
          git rm .github/workflows/oreshnik-pub06-autonomous.yml
          git commit -m "chore(ci): remove PUB-06 ephemeral delivery workflow"
          git push origin "HEAD:$FUNCTIONAL_BRANCH"
          test -z "$(git diff --name-only origin/master...HEAD | grep -Ev '^(apps/web/lib/publishers/|apps/web/app/api/publishing/|packages/integrations/)' || true)"

      - name: Validate clean committed candidate
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/pub06-candidate"
          git worktree add --detach "$CANDIDATE" HEAD
          cd "$CANDIDATE"
          npm ci --ignore-scripts
          npm run db:generate
          npm run oreshnik:ready
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "0.3.0-alpha.6"
          npm run test -w @heptacore/integrations
          npm run typecheck
          npm run build
          npm run test
          npm run worker:validate
          node node_modules/oreshnik-cli/dist/cli.js reconcile --check --json
          git diff --check origin/master...HEAD
          git status --porcelain


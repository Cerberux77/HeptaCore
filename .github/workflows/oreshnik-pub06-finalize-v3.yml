name: Oreshnik PUB-06 Finalize v3
on:
  push:
    branches:
      - dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
permissions:
  contents: write
  actions: read
concurrency:
  group: heptacore-pub06-finalize
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TASK: S-HC-PUB-06-REELS-STORIES-PUBLISHERS
      RUN_ID: run-manuel-S-HC-PUB-06-REELS-STORIES-PUBLISHERS-20260906155441-d36bde04
      INSTANCE: manuel-chatgpt2
      SESSION: session_93473a46b2904930916a9715222bf6d5
      BRANCH: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dispatch/manuel/manuel-chatgpt2/publishing/S-HC-PUB-06-REELS-STORIES-PUBLISHERS/6b8d9d8384
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove ephemeral bootstrap and install controller
        run: |
          set -euo pipefail
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
          git rm .github/workflows/oreshnik-pub06-finalize-v3.yml
          git commit -m "chore(ci): remove PUB-06 finalize v3 bootstrap"
          git push origin "HEAD:$BRANCH"
          npm ci --ignore-scripts
          npm run db:generate
      - name: Rehydrate exact governed Run
        id: takeover
        run: |
          set -euo pipefail
          WTROOT="$RUNNER_TEMP/oreshnik-wt-pub06-finalize-v3"
          node node_modules/oreshnik-cli/dist/cli.js dispatch init --mother master --worktree-root "$WTROOT" --repo "$GITHUB_WORKSPACE" --json > "$RUNNER_TEMP/init.json"
          node node_modules/oreshnik-cli/dist/cli.js dispatch takeover \
            --run "$RUN_ID" \
            --reason "Resume exact PUB-06 Run after clean-handoff lifecycle correction" \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" --takeover \
            --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/takeover.json"
          WT="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/takeover.json"); process.stdout.write(x.worktreePath)')"
          test -n "$WT" && test -d "$WT"
          echo "worktree=$WT" >> "$GITHUB_OUTPUT"
      - name: Prepare managed worktree
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          npm ci --ignore-scripts
          TMP="$(mktemp -d)"; cd "$TMP"
          TGZ="$(npm pack @esbuild/linux-x64@0.28.0 --silent)"
          tar -xzf "$TGZ"
          mkdir -p "$WT/node_modules/@esbuild/linux-x64"
          cp -R package/. "$WT/node_modules/@esbuild/linux-x64/"
          cd "$WT"
          npm run db:generate
          git config user.name "Manuel Vera via ChatGPT Operator"
          git config user.email "manuel@heptacore.dev"
      - name: Persist native dry-run validation gate
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node --input-type=module <<'NODE'
          import { createTaskRuntimeService, runStructuredCommand } from 'oreshnik-cli';
          const result=await runStructuredCommand('npm',['run','test','-w','@heptacore/integrations'],{
            cwd: process.cwd(), timeout: 180000, gateId: 'dry-run', mirrorOutput: true
          });
          if (!result.passed) process.exit(1);
          const runtime=createTaskRuntimeService(process.cwd());
          const recorded=runtime.recordTaskValidationResults({taskId:process.env.TASK,operator:'manuel',runId:process.env.RUN_ID,gateResults:[result]});
          if (!recorded.ok) throw new Error(recorded.error.message);
          const persisted=recorded.value.runManifest.validationGateResults?.filter(x=>x.gateId==='dry-run').at(-1);
          if (!persisted?.passed) throw new Error('dry-run PASS gate was not persisted');
          console.log(`Persisted dry-run attempt=${persisted.attempt} exit=${persisted.exitCode}`);
          NODE
      - name: Commit native runtime mutations before handoff
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          mapfile -t CHANGED < <(git status --porcelain=v1 | sed 's/^...//')
          printf 'pre-handoff changed: %s\n' "${CHANGED[@]:-}"
          for p in "${CHANGED[@]}"; do
            case "$p" in
              var/oreshnik/task-board.json|var/oreshnik/tasks/$TASK.json|var/oreshnik/runs/$TASK/*|var/oreshnik/claims/$TASK.json) ;;
              *) echo "Unexpected pre-handoff path: $p" >&2; exit 1 ;;
            esac
          done
          if ((${#CHANGED[@]})); then
            git add -- "${CHANGED[@]}"
            git commit -m "chore(oreshnik): persist PUB-06 validation runtime"
            git push origin "HEAD:$BRANCH"
          fi
          test -z "$(git status --porcelain)"
      - name: Create stable canonical handoff
        id: handoff
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js handoff create \
            --task "$TASK" --run "$RUN_ID" --operator manuel --reason validation \
            --objective "Complete real Meta Reels and Stories publishing for Instagram and Facebook with fail-closed format validation and durable transactional finalization." \
            --implemented "Instagram Reel real publisher flow" "Instagram Story image and video publisher flows" "Facebook Story image and video publisher flows" "Facebook Reel publisher flow" "PUB-06 format dry-run validation and supportedFormats fail-closed contract" \
            --decision "Scheduled parity remains outside PUB-06 and stays blocked until separately validated" \
            --test-run "Provider-specific PUB-06 suite: 8/8 PASS" "Full typecheck/build/tests/worker/reconcile/diff validation: PASS in Actions run 34062221297" \
            --gate "typecheck PASS" "build PASS" "tests PASS" "worker validation PASS" "reconcile PASS" "dry-run PASS" \
            --exact-point "PUB-06 implementation and validation complete; deliver this exact Run for canonical integration." \
            --first-command "oreshnik evidence --ready-for-integration" \
            --completion-criterion "Task reaches ready_for_integration with released claim and durable handoff/evidence." \
            --json | tee "$RUNNER_TEMP/handoff.json"
          MD="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/handoff.json"); process.stdout.write(x.markdownPath || "")')"
          JSONP="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/handoff.json"); process.stdout.write(x.jsonPath || "")')"
          CLASS="$(node -e 'const x=require(process.env.RUNNER_TEMP+"/handoff.json"); process.stdout.write(x.document?.stability?.classification || "")')"
          test -n "$MD" && test -f "$MD" && test -n "$JSONP" && test -f "$JSONP"
          test "$CLASS" = "STABLE_COMPLETE" || { cat "$RUNNER_TEMP/handoff.json"; exit 1; }
          node node_modules/oreshnik-cli/dist/cli.js handoff validate --path "$JSONP" --json
          echo "markdown=$MD" >> "$GITHUB_OUTPUT"
      - name: Advance same Run to ready_for_integration
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          MD='${{ steps.handoff.outputs.markdown }}'
          cd "$WT"
          node node_modules/oreshnik-cli/dist/cli.js evidence \
            --task "$TASK" --run "$RUN_ID" --operator manuel --handoff "$MD" \
            --details "PUB-06 technically accepted: 8/8 provider tests and native dry-run, typecheck, build, full tests, worker validation, reconcile and diff gates PASS." \
            --ready-for-integration
          node - <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync('var/oreshnik/task-board.json','utf8'));
          const t=b.tasks.find(x=>x.id===process.env.TASK);
          if (!t || t.status!=='ready_for_integration' || t.activeRun) throw new Error(`unexpected delivery state status=${t?.status} activeRun=${!!t?.activeRun}`);
          const claim=JSON.parse(fs.readFileSync(`var/oreshnik/claims/${process.env.TASK}.json`,'utf8'));
          if (claim.status!=='released') throw new Error(`claim=${claim.status}`);
          console.log('ready_for_integration and released claim verified');
          NODE
      - name: Persist governed delivery
        run: |
          set -euo pipefail
          WT='${{ steps.takeover.outputs.worktree }}'
          cd "$WT"
          git add var/oreshnik docs/oreshnik docs/07_handoffs docs/obsidian-vault 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "chore(oreshnik): deliver PUB-06 ready for integration"; fi
          git push origin "HEAD:$BRANCH"
          test -z "$(git status --porcelain)"
      - name: Reconcile dispatcher and verify durable branch
        run: |
          set -euo pipefail
          node node_modules/oreshnik-cli/dist/cli.js dispatch release \
            --operator manuel --harness chatgpt --instance "$INSTANCE" --session "$SESSION" \
            --run "$RUN_ID" --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/release.json" || true
          node node_modules/oreshnik-cli/dist/cli.js dispatch reconcile --repo "$GITHUB_WORKSPACE" --json | tee "$RUNNER_TEMP/reconcile.json"
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const raw=execFileSync('git',['show',`origin/${process.env.BRANCH}:var/oreshnik/tasks/${process.env.TASK}.json`],{encoding:'utf8'});
          const t=JSON.parse(raw);
          if(t.status!=='ready_for_integration' || t.activeRun) throw new Error(`durable branch state=${t.status} activeRun=${!!t.activeRun}`);
          console.log(JSON.stringify({status:t.status,branch:process.env.BRANCH},null,2));
          NODE

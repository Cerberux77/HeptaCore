name: Ops EMAIL01A Typecheck Diagnostic

on:
  push:
    branches:
      - ops/email01a-deterministic-rescue-20260910
    paths:
      - .github/email01a-typecheck-trigger

permissions:
  contents: read
  actions: read

concurrency:
  group: heptacore-email01a-typecheck-diagnostic
  cancel-in-progress: true

env:
  ORESHNIK_VERSION: 0.3.0-alpha.6
  BRANCH: dispatch/manuel/manuel-chatgpt1/email-infra/S-HC-EMAIL-01A-TRANSACTIONAL-SOFTWARE-FOUNDATION/afe65dfa54
  EXPECTED_HEAD: 30bcd27315bb06d0f95684ee613105351e06b124

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout governed functional branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact branch and Oreshnik alpha6
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          npm ci --ignore-scripts
          test "$(node node_modules/oreshnik-cli/dist/cli.js --version)" = "$ORESHNIK_VERSION"

      - name: Run raw repository typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/email01a-typecheck.log"
